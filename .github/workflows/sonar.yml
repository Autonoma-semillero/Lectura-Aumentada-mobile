name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  sonar:
    name: Análisis de código
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Comprobar que SONAR_TOKEN está configurado
        id: guard
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN no está configurado; se omite el análisis. Ver README."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configurado == 'true'
        with:
          # SonarCloud necesita el historial completo para atribuir los issues
          # a su autor y calcular el "new code".
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.configurado == 'true'
        with:
          distribution: temurin
          # El proyecto compila contra Java 21 (compileOptions en app/build.gradle.kts).
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.guard.outputs.configurado == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.configurado == 'true'

      - name: Generar cobertura y analizar
        if: steps.guard.outputs.configurado == 'true'
        run: ./gradlew createDebugUnitTestCoverageReport sonar --no-daemon
