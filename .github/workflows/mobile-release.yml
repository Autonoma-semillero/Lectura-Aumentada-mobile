name: Publish Android APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - .github/workflows/mobile-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            tag="v1.0.0"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build installable APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare release asset and notes
        id: artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          asset="lectura-aumentada-mobile-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${asset}"
          checksum="$(sha256sum "${asset}" | awk '{print $1}')"
          size="$(du -h "${asset}" | awk '{print $1}')"
          {
            echo "asset=${asset}"
            echo "checksum=${checksum}"
          } >> "${GITHUB_OUTPUT}"
          cat > release-notes.md <<EOF
          ## Lectura Aumentada Mobile ${RELEASE_TAG}

          - Inicio de sesión por nombre de usuario o correo electrónico.
          - Integración de planes y sesiones Doman con el backend productivo.
          - Gestión de grupos y asignación de planes a estudiantes.
          - Experiencia de realidad aumentada y contenido de práctica incluidos.

          **Android mínimo:** 8.0 (API 26)

          **Tamaño del APK:** ${size}

          **SHA-256:** ${checksum}

          > APK para instalación y validación interna, firmado con el certificado Android Debug. No es un artefacto firmado para Google Play.
          EOF

      - name: Create or update GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.artifact.outputs.asset }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Lectura Aumentada Mobile ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" "${ASSET}" \
              --verify-tag \
              --title "Lectura Aumentada Mobile ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Record successful publication
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git notes --ref=releases add -f \
            -m "Published ${RELEASE_TAG}; workflow ${WORKFLOW_SHA}; APK SHA-256 ${CHECKSUM}" \
            "${RELEASE_TAG}^{commit}"
          git push origin refs/notes/releases
