<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob: data: https:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: data: https:; connect-src 'self' blob: data: https:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none';"
    />
    <title>Lectura Aumentada AR - Tarjeta flotante</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/aframe.min.js"></script>
  </head>
  <body>
    <main id="experience" aria-label="Tarjeta flotante de realidad aumentada">
      <div id="ar-root" aria-hidden="true"></div>

      <div id="float-chrome" class="hidden">
        <div class="float-tint" aria-hidden="true"></div>
        <div class="float-vignette" aria-hidden="true"></div>
        <div class="float-viewfinder" aria-hidden="true">
          <span class="float-viewfinder-corner float-viewfinder-corner--tl"></span>
          <span class="float-viewfinder-corner float-viewfinder-corner--tr"></span>
          <span class="float-viewfinder-corner float-viewfinder-corner--bl"></span>
          <span class="float-viewfinder-corner float-viewfinder-corner--br"></span>
        </div>
        <div class="float-camera-badge" role="img" aria-label="Cámara encendida">
          <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true">
            <path
              d="M3 9.5a3 3 0 0 1 3-3h2.6l1.6-2.2h7.6l1.6 2.2H22a3 3 0 0 1 3 3V20a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"
              fill="#FFFFFF"
            ></path>
            <circle cx="14" cy="14.5" r="4.6" fill="#26324B"></circle>
            <circle cx="14" cy="14.5" r="2.2" fill="#FFFFFF"></circle>
          </svg>
          <span class="float-rec-dot" aria-hidden="true"></span>
        </div>
        <div class="float-audio-indicator" role="img" aria-label="Se escucha la palabra">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <path
              d="M6 15h7l9-7v24l-9-7H6z"
              fill="#FFFFFF"
              stroke="#FFFFFF"
              stroke-width="2"
              stroke-linejoin="round"
            ></path>
            <path
              class="float-wave float-wave--1"
              d="M27 14.5a8 8 0 0 1 0 11"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="2.8"
              stroke-linecap="round"
            ></path>
            <path
              class="float-wave float-wave--2"
              d="M31.5 10.5a14 14 0 0 1 0 19"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="2.8"
              stroke-linecap="round"
            ></path>
          </svg>
        </div>
      </div>

      <section id="activation" class="center-card" aria-labelledby="activation-title">
        <h1 id="activation-title">Realidad aumentada</h1>
        <p id="activation-copy">
          La cámara se usará solamente para mostrar la tarjeta flotante. Ninguna imagen se envía al servidor.
        </p>
        <button id="activate-camera" class="primary-action" type="button">Activar cámara</button>
        <p id="compatibility" class="detail" aria-live="polite"></p>
      </section>

      <section id="loading" class="center-card hidden" aria-live="assertive">
        <div class="spinner" aria-hidden="true"></div>
        <p>Preparando la cámara…</p>
      </section>

      <section id="error-card" class="center-card hidden" role="alert">
        <h2>No pudimos iniciar la experiencia</h2>
        <p id="error-message"></p>
        <button id="retry-camera" class="primary-action" type="button">Reintentar</button>
      </section>
    </main>

    <script type="module" src="./js/app-float.js"></script>
  </body>
</html>
