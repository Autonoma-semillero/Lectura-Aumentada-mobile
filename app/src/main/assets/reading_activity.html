<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lectura Inclusiva</title>
  <style>
    :root {
      --bg: #f4f8ff;
      --card: #ffffff;
      --text: #12314d;
      --accent: #d84f1a;
      --primary: #1e5aa8;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at 20% 20%, #e8f0ff, var(--bg));
      color: var(--text);
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(680px, 100%);
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(18, 49, 77, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 2rem;
    }
    p {
      margin: 0 0 20px;
      font-size: 1.1rem;
      line-height: 1.4;
    }
    .word {
      margin: 12px auto 0;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.08em;
      background: #fff6f0;
      border: 2px dashed #f1b18e;
      border-radius: 16px;
      padding: 16px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Lectura Inclusiva</h1>
      <p>Bienvenido. Esta es la actividad inicial para practicar palabras.</p>
      <div class="word">CASA</div>
    </section>
  </main>
</body>
</html>
